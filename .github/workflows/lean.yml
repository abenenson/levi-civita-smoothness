name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline evidence and rejection controls
        run: |
          python3 scripts/verify_evidence.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Fetch focused Mathlib cache
        run: python3 scripts/verify_live.py --cache
      - name: Strict authored builds, full source lint, and axiom audits
        run: python3 scripts/verify_live.py
      - name: Retain live verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-verification-evidence
          path: verification-artifacts/
          if-no-files-found: ignore
          retention-days: 14
